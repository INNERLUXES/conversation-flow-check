<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat with the salon</title>
</head>
<body>
  <!-- <div class="messages" role="log"> in a comment is not an element -->
  <section class="chat-widget">
    <div id="chat-messages" class="chat-messages">
      <p class="message bot">Welcome to Maple Street Salon.</p>
    </div>
    <form class="chat-form">
      <input id="chat-input" type="text" placeholder="Type here">
      <button type="submit">Send</button>
    </form>
  </section>
</body>
</html>
