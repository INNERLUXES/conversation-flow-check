<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Chat with the salon</title>
</head>
<body>
  <section class="chat-widget" aria-label="Chat with the salon">
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-label="Conversation">
      <p class="message bot">Hi, I am an automated assistant for Maple Street Salon.</p>
    </div>
    <form class="chat-form">
      <label for="chat-input">Your message</label>
      <input id="chat-input" type="text" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </section>
</body>
</html>
